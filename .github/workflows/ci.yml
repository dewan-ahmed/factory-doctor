name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install V
        run: |
          version="$(cat .v-version)"
          curl -fsSL "https://github.com/vlang/v/releases/download/${version}/v_linux.zip" -o /tmp/v.zip
          unzip -q /tmp/v.zip -d "${HOME}"
          echo "${HOME}/v" >> "${GITHUB_PATH}"
      - name: Check formatting
        run: v fmt -verify .
      - name: Check Markdown
        run: v check-md README.md AGENTS.md
      - name: Run tests
        run: v -silent test .
      - name: Build release binary
        run: v -prod -o factory-doctor .

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install V
        shell: bash
        run: |
          version="$(cat .v-version)"
          curl -fsSL "https://github.com/vlang/v/releases/download/${version}/v_windows.zip" -o "${RUNNER_TEMP}/v.zip"
          unzip -q "${RUNNER_TEMP}/v.zip" -d "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/v" >> "${GITHUB_PATH}"
      - name: Run tests
        run: v -silent test .
      - name: Build release binary
        run: v -prod -o factory-doctor.exe .
